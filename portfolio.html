<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .profile-pic {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 40px auto;
      border: 4px solid #4a90e2;
    }
      body {
            transition: background-color 0.5s ease;
            text-align: center;
            padding-top: 100px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #444;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
   
  </style>
</head>
<body>
  <header>
    <div class="container">
      <img src="vera.JPG" alt="Profile" class="profile-pic">
      <h1>Hi, I'm Vera Lar</h1>
      <p>Age: 26</p>
      <p>I dream of working at Google, Meta, Microsoft, and more!</p>
    </div>
  </header>
   <button onclick="changeBackgroundColor()">Change Background Color</button>
  <main>
    <section>
      <h2>My Interests</h2>
      <ul>
        <li>Web Development</li>
        <li>Artificial Intelligence</li>
        <li>Problem Solving</li>
      </ul>
    </section>

    <section>
      <h2>Skills</h2>
      <p>Python, HTML, CSS, JavaScript</p>
     
    <script>
        function changeBackgroundColor() {
            // Generate a random color
            const randomColor = '#' + Math.floor(Math.random()*16777215).toString(16);
            document.body.style.backgroundColor = randomColor;
        }
    </script>



    </section>
  </main>

  <footer>
    <p>&copy; 2025 vera lar — Future Software Engineer 🚀</p>
  </footer>
</body>
</html>
